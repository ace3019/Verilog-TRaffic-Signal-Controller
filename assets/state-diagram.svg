<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Traffic signal controller state diagram</title><desc id="desc">Five states transfer a green signal between a main highway and country road through yellow and all-red phases.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e3a46"/></marker><style>text{font-family:Arial,sans-serif;fill:#17212b}.state{fill:#f8fbff;stroke:#1677b8;stroke-width:3}.arrow{stroke:#2e3a46;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font-size:17px;font-weight:700}.small{font-size:14px;font-weight:400}.title{font-size:27px;font-weight:700}</style></defs>
  <rect width="960" height="460" fill="#ffffff"/><text x="480" y="47" text-anchor="middle" class="title">Traffic Signal Controller FSM</text>
  <circle class="state" cx="130" cy="215" r="72"/><text x="130" y="207" text-anchor="middle" class="label">S0</text><text x="130" y="231" text-anchor="middle" class="small">Highway green</text>
  <circle class="state" cx="310" cy="115" r="72"/><text x="310" y="107" text-anchor="middle" class="label">S1</text><text x="310" y="131" text-anchor="middle" class="small">Highway yellow</text>
  <circle class="state" cx="510" cy="115" r="72"/><text x="510" y="107" text-anchor="middle" class="label">S2</text><text x="510" y="131" text-anchor="middle" class="small">All red</text>
  <circle class="state" cx="700" cy="215" r="72"/><text x="700" y="207" text-anchor="middle" class="label">S3</text><text x="700" y="231" text-anchor="middle" class="small">Country green</text>
  <circle class="state" cx="510" cy="340" r="72"/><text x="510" y="332" text-anchor="middle" class="label">S4</text><text x="510" y="356" text-anchor="middle" class="small">Country yellow</text>
  <path class="arrow" d="M193 180 L244 151"/><text x="210" y="143" class="small">car = 1</text>
  <path class="arrow" d="M383 115 L431 115"/><text x="397" y="97" class="small">yellow done</text>
  <path class="arrow" d="M576 151 L642 185"/><text x="580" y="177" class="small">all-red done</text>
  <path class="arrow" d="M661 276 L558 323"/><text x="602" y="318" class="small">car = 0</text>
  <path class="arrow" d="M444 365 L190 252"/><text x="292" y="342" class="small">yellow done</text>
  <path class="arrow" d="M102 144 C55 95, 195 82, 177 154"/><text x="55" y="102" class="small">car = 0</text>
  <path class="arrow" d="M756 162 C830 100, 837 302, 755 265"/><text x="826" y="220" class="small">car = 1</text>
  <text x="480" y="430" text-anchor="middle" class="small">Outputs are Moore decoded: never both roads green.</text>
</svg>
